<!DOCTYPE html>
<html lang="en">
<body>
    <div class="row">
        <div class="content">
            <form action="#">
                <label for="pass">Password:</label><br>
                <input type="password" id="pass" name="password" required><br><br>

                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required><br><br>

                <label for="tob">Time of Birth:</label><br>
                <input type="time" id="tob" name="tob" required><br><br>

                <label for="color">Favourite Color:</label><br>
                <input type="color" id="color" name="fav_color" required><br><br>

                <label for="age">Select Age:</label><br>
                <input type="range" id="age" name="age" min="0" max="100" required><br><br>

                <button type="submit">Submit Details</button>
            </form>
        </div>
    </div>
</body>
</html>
