        <a href="projects.html">Projects</a>
        <a href="products.html">Products</a>
        <a href="hobbies.html">Hobbies</a>
        <a href="contact.html">Contact</a>
    </div>

    <div class="banner">
        <h1>Talk to us</h1>
    </div>

    <div class="row">
        <div class="left_side_bar">
            <h3>Left Side Bar</h3>
        </div>
        
        <div class="content">
            <h1>Contact Us</h1>
            <p>This is the contact page of our website.</p>

            <form action="/submit" method="post">
                <input type="text" name="full_name" placeholder="Enter your Name" required><br>
                <input type="email" name="email" placeholder="Enter your Email" required><br>
                <input type="number" name="phone" placeholder="Enter your Phone Number" required><br>
                <input type="password" name="password" placeholder="Enter your Password" required><br>
                
                <input type="date" name="dob" required><br>
                <input type="time" name="tob" required><br>
                <input type="color" name="fav_color" required> <label>Favourite Color</label><br>
                <input type="range" name="age_range" min="0" max="100" required> <label>Age</label><br>
                <input type="url" name="website" placeholder="Enter your Website" required><br>

                <p>Select your country:</p>
                <select name="country" id="country_select" required>
                    <option value="">Select your country</option>
                    <option value="kenya">Kenya</option>
                    <option value="uganda">Uganda</option>
                    <option value="tanzania">Tanzania</option>
                    <option value="rwanda">Rwanda</option>
                </select><br><br>

                <textarea name="message" id="message_box" cols="30" rows="5" placeholder="Enter your message"></textarea><br>

                <button type="submit">Submit Details</button><br>
            </form>

            <dl style="margin-top: 20px;">
                <dt>Email</dt>
                <dd><a href="mailto:bbit@example.com">bbit@example.com</a></dd>
                <dt>Phone</dt>
                <dd><a href="tel:+254765567890">+254 765 567 890</a></dd>
                <dt>Address</dt>
                <dd>123 Athiriver, Machakos</dd>
            </dl>
        </div>

        <div class="right_side_bar">
            <h3>Right Side Bar</h3>
        </div>
    </div>

    <div class="footer">
        &#169; BBIT 2026
    </div>
</body>
</html>
